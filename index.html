<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touchpad Remote</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .touchpad { width: 92%; height: 60%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; display: flex; align-items: center; justify-content: center; touch-action: none; backdrop-filter: blur(10px); margin-top: 20px; font-weight: bold; opacity: 0.5; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 92%; margin-top: 20px; }
        .btn { background: rgba(99, 102, 241, 0.2); border: 1px solid var(--primary); padding: 20px; border-radius: 20px; color: white; font-weight: bold; text-align: center; }
        .btn:active { background: var(--primary); transform: scale(0.98); }
    </style>
</head>
<body>
    <h2 style="margin-top:20px">PC Control</h2>
    <div class="touchpad" id="area">ТАЧПАД</div>
    <div class="controls">
        <div class="btn" onclick="sendAction('left_click')">L-Click</div>
        <div class="btn" onclick="sendAction('right_click')">R-Click</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ОБЯЗАТЕЛЬНО: Возьми HTTPS ссылку из терминала Pinggy (как на твоем скриншоте)
        const SERVER_URL = "https://mqrrf-95-27-33-166.a.free.pinggy.link/mouse"; 

        const area = document.getElementById('area');
        let lastX = 0, lastY = 0;

        area.addEventListener('touchstart', e => {
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        area.addEventListener('touchmove', e => {
            const dx = e.touches[0].clientX - lastX;
            const dy = e.touches[0].clientY - lastY;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            sendAction('move', { dx, dy });
        });

        function sendAction(action, params = {}) {
            fetch(SERVER_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Pinggy-No-Screen': 'true' // ЭТО ОТКЛЮЧИТ БЛОКИРОВКУ PINGGY
                },
                body: JSON.stringify({ action, ...params })
            }).catch(e => console.error("Ошибка сети"));
            
            if (action.includes('click')) tg.HapticFeedback.impactOccurred('medium');
        }
    </script>
</body>
</html>
